    <style>
      :root {
        --bg: #0b0b0d;
        --bg-raised: #141417;
        --text: #f2f0ea;
        --muted: #9a968c;
        --accent: #d97757;
        --border: #26252a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
      }
      main { max-width: 480px; text-align: center; }
      .mark { width: 56px; height: 56px; margin: 0 auto 1.5rem; opacity: 0.9; }
      h1 {
        font-family: 'DM Serif Display', Georgia, serif;
        font-size: 2.25rem;
        margin: 0 0 0.75rem;
        letter-spacing: -0.01em;
      }
      p { color: var(--muted); line-height: 1.6; margin: 0 0 2rem; font-size: 1rem; }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        background: var(--bg-raised);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        text-decoration: none;
        font-size: 0.95rem;
        transition: border-color 0.2s ease, transform 0.2s ease;
      }
      .cta:hover { border-color: var(--accent); transform: translateY(-1px); }
      footer { margin-top: 3rem; color: var(--muted); font-size: 0.8rem; }
      footer a { color: var(--muted); }
    </style>
